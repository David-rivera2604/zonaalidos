<form id='MainForm'>
    <fieldset>
        <div class="row">
            <!-- DocumentNumber -->
            <div class='col-sm-4 col-md-3'>
                <div class='form-group'>
                    <label class='control-label' for='DocumentNumber'>
                        Identificación<span class='required-mark'
                                            title='Este campo debe ser llenado de forma obligatoria'>*</span>
                    </label>
                    <div class='input-group'>
                        <span class='input-group-addon'>
                            <span class='glyphicon glyphicon-barcode'></span>
                        </span>

                        <div class="input-group-prepend">
                            <button class="btn btn-default dropdown-toggle"
                                    type="button" data-toggle="dropdown"
                                    aria-haspopup="true" aria-expanded="false" data-value='1' id="DocumentType">
                                Cédula
                            </button>
                            <div class="dropdown-menu">
                                <a class="dropdown-item active"
                                   href="#" data-value='1'>Cédula</a>
                                <a class="dropdown-item" href="#" data-value='2'>
                                    Cédula de
                                    residencia
                                </a>
                                <a class="dropdown-item" href="#" data-value='3'>Pasaporte</a>
                                <a class="dropdown-item" href="#" data-value='4'>
                                    Cédula
                                    jurídica
                                </a>
                            </div>
                        </div>

                        <input id='DocumentNumber' name='DocumentNumber'
                               type='text' class='form-control' size='20'
                               maxlength='20' placeholder="0X-XXXX-XXXX">

                    </div>
                    <div id='DocumentNumber_validate'></div>
                </div>
            </div>
            <!-- FirstName -->
            <div class='col-sm-4 col-md-3'>
                <div class='form-group'>
                    <label class='control-label' for='FirstName'>
                        Nombres<span class='required-mark' title='Este campo debe ser llenado de forma obligatoria'>*</span>
                    </label>
                    <div class='input-group'>
                        <span class='input-group-addon'>
                            <span class='glyphicon glyphicon-user'></span>
                        </span>
                        <input id='FirstName' name='FirstName' type='text'
                               class='form-control' size='40' maxlength='40'>
                        <input id='MiddleName' name='MiddleName' type='text'
                               class='form-control' size='40' maxlength='40'>
                    </div>
                    <div id='FirstName_validate'></div>
                </div>
            </div>
            <!-- LastName -->
            <div class='col-sm-4 col-md-3'>
                <div class='form-group'>
                    <label class='control-label' for='LastName'>
                        Apellidos<span class='required-mark' title='Este campo debe ser llenado de forma obligatoria'>*</span>
                    </label>
                    <div class='input-group'>
                        <span class='input-group-addon'>
                            <span class='glyphicon glyphicon-user'></span>
                        </span>
                        <input id='LastName' name='LastName' type='text'
                               class='form-control' size='40' maxlength='40'>
                        <input id='SecondLastName' name='SecondLastName'
                               type='text' class='form-control' size='40'
                               maxlength='40'>
                    </div>
                    <div id='LastName_validate'></div>
                </div>
            </div>
            <!-- BirthDate -->
            <div class='col-sm-4 col-md-3'>
                <div class='form-group'>
                    <label class='control-label' for='BirthDate'>
                        Fecha de
                        nacimiento<span class='required-mark' title='Este campo debe ser llenado de forma obligatoria'>*</span>
                    </label>
                    <div class='input-group date' id='BirthDate_group'>
                        <input id='BirthDate' name='BirthDate' type='text'
                               class='form-control' size='10' maxlength='10'
                               placeholder='día/mes/año'>
                        <span class='input-group-addon'>
                            <span class='glyphicon glyphicon-calendar'></span>
                        </span>
                    </div>
                    <div id='BirthDate_validate'></div>

                </div>
            </div>
            <!-- Gender -->
            <div class='col-sm-4 col-md-3'>
                <div class='form-group'>
                    <label class='control-label' for='Gender'>
                        Sexo<span class='required-mark' title='Este campo debe ser llenado de forma obligatoria'>*</span>
                    </label>
                    <select id='Gender' name='Gender'
                            class='form-control'></select>
                </div>
            </div>
            <!-- CivilStatus -->
            <div class='col-sm-4 col-md-3'>
                <div class='form-group'>
                    <label class='control-label' for='CivilStatus'>
                        Estado civil<span class='required-mark' title='Este campo debe ser llenado de forma obligatoria'>*</span>
                    </label>
                    <select id='CivilStatus' name='CivilStatus'
                            class='form-control'></select>
                </div>
            </div>
            <!-- Height -->
            <div class='col-sm-4 col-md-3'>
                <div class='form-group'>
                    <label class='control-label' for='Height'>Estatura</label>
                    <div class='input-group'>
                        <input id='Height' name='Height' type='text'
                               class='form-control text-right' size='5'
                               maxlength='5'>
                        <span class='input-group-addon'>
                            <small class="text-muted" title="Metros">mts</small>
                        </span>
                    </div>
                </div>
            </div>
            <!-- Weight -->
            <div class='col-sm-4 col-md-3'>
                <div class='form-group'>
                    <label class='control-label' for='Weight'>Peso</label>
                    <div class='input-group'>
                        <input id='Weight' name='Weight' type='text'
                               class='form-control text-right' size='5'
                               maxlength='5'>
                        <span class='input-group-addon'>
                            <small class="text-muted" title="Libras">lbs</small>
                        </span>
                    </div>

                </div>
            </div>
            <!-- BloodPressureSystolic / BloodPressureDiastolic -->
            <div class='col-sm-4 col-md-3'>
                <div class='form-group'>
                    <label class='control-label' for='Weight'>Presión arterial</label>
                    <div class='input-group'>
                        <input id='BloodPressureSystolic' name='BloodPressureSystolic' type='text' class='form-control text-right' size='3' maxlength='3'>
                        <span class='input-group-addon'>
                            /
                        </span>
                        <input id='BloodPressureDiastolic' name='BloodPressureDiastolic' type='text' class='form-control text-left' size='3' maxlength='3'>
                    </div>

                </div>
            </div>
            <!-- PhoneNumber -->
            <div class='col-sm-4 col-md-3'>
                <div class='form-group'>
                    <label class='control-label'
                           for='PhoneNumber'>Teléfono</label>
                    <div class='input-group'>

                        <span class='input-group-addon'>
                            <span class='glyphicon glyphicon-earphone'></span>
                        </span>

                        <div class="input-group-prepend">
                            <button class="btn btn-default dropdown-toggle"
                                    type="button" data-toggle="dropdown"
                                    aria-haspopup="true" aria-expanded="false" id="PhoneType" data-value='1'>
                                Celular
                            </button>
                            <div class="dropdown-menu">
                                <a class="dropdown-item active" data-value='1'
                                   href="#">Celular</a>
                                <a class="dropdown-item" data-value='2' href="#">Habitación</a>
                                <a class="dropdown-item" data-value='3' href="#">Oficina</a>
                                <a class="dropdown-item" data-value='4' href="#">Fax</a>
                            </div>
                        </div>

                        <input id='PhoneNumber' name='PhoneNumber' type='text'
                               class='form-control' size='9' maxlength='9'>

                    </div>
                    <div id='PhoneNumber_validate'></div>
                </div>
            </div>
            <!-- PrimaryEmailAddress -->
            <div class='col-sm-4 col-md-3'>
                <div class='form-group'>
                    <label class='control-label' for='PrimaryEmailAddress'>
                        Correo
                        electrónico<span class='required-mark' title='Este campo debe ser llenado de forma obligatoria'>*</span>
                    </label>
                    <div class='input-group'>
                        <span class='input-group-addon'>
                            <span class='glyphicon glyphicon-envelope'></span>
                        </span>
                        <input id='PrimaryEmailAddress'
                               name='PrimaryEmailAddress' type='text'
                               class='form-control' size='80' maxlength='80'>
                    </div>
                    <div id='PrimaryEmailAddress_validate'></div>
                </div>
            </div>
        </div>


        <div class="row">


            <div class="col-lg-12">

                <h4><i class="fa fa-map-marker"></i> Dirección</h4>
                <div class="hr-line-dashed"
                     style="border-top: 1px solid #e7eaec; margin: 10px 0;"></div>

                <div class="row">

                    <!-- Sequence -->
                    <input id='Sequence' name='Sequence' type='hidden' value=''>

                    <!-- Province -->
                    <div class='col-sm-2 col-md-2'>
                        <div class='form-group'>
                            <label class='control-label'
                                   for='Province'>Provincia</label>
                            <select id='Province' name='Province'
                                    class='form-control'></select>
                        </div>
                    </div>
                    <!-- Canton -->
                    <div class='col-sm-2 col-md-2'>
                        <div class='form-group'>
                            <label class='control-label'
                                   for='Canton'>Cantón</label>
                            <select id='Canton' name='Canton'
                                    class='form-control'></select>
                        </div>
                    </div>
                    <!-- District -->
                    <div class='col-sm-2 col-md-2'>
                        <div class='form-group'>
                            <label class='control-label'
                                   for='District'>Distrito</label>
                            <select id='District' name='District'
                                    class='form-control'></select>
                        </div>
                    </div>

                    <!-- AddressDetail -->
                    <div class='col-sm-6 col-md-6'>
                        <div class='form-group'>
                            <label class='control-label'
                                   for='AddressDetail'>Dirección</label>
                            <input id='AddressDetail' name='AddressDetail'
                                   type='text' class='form-control' size='120'
                                   maxlength='120'>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="row">


            <div class="col-lg-12">

                <h4>Otros datos</h4>
                <div class="hr-line-dashed"
                     style="border-top: 1px solid #e7eaec; margin: 10px 0;"></div>

                <div class="row">

                    <!-- Occupation -->
                    <div class='col-sm-4 col-md-3'>
                        <div class='form-group'>
                            <label class='control-label' for='Occupation'>Ocupación</label>
                            <input id='Occupation' name='Occupation' type='text' class='form-control' size='40' maxlength='40'>
                        </div>
                    </div>
                    <!-- RetirementModality -->
                    <div class='col-sm-4 col-md-3'>
                        <div class='form-group'>
                            <label class='control-label' for='RetirementModality'>Condición</label>
                            <select id='RetirementModality' name='RetirementModality' class='form-control'>
                            </select>
                        </div>
                    </div>
                    <!-- RetirementCause -->
                    <div class='col-sm-4 col-md-3'>
                        <div class='form-group'>
                            <label class='control-label' for='RetirementCause'>Causa de pensión</label>
                            <input id='RetirementCause' name='RetirementCause' type='text' class='form-control' size='40' maxlength='40' disabled="disabled">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </fieldset>
</form>
