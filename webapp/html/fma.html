<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <title>Bootdey.com</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <style type="text/css">

        body {
            margin-top: 20px;
            background: #eee;
            font-family: "Helvetica Neue",Helvetica,Arial,sans-serif;
            font-size: 14px;
        }

        .file-box {
            float: left;
            width: 220px;
        }

        .file-manager h5 {
            text-transform: uppercase;
            font-size: 14px;
        }

        .file-manager {
            list-style: none outside none;
            margin: 0;
            padding: 0;
        }

        .folder-list li a {
            color: #666666;
            display: block;
            padding: 5px 0;
        }

        .folder-list li {
            border-bottom: 1px solid #e7eaec;
            display: block;
        }

            .folder-list li i {
                margin-right: 8px;
                color: #3d4d5d;
            }

        .category-list li a {
            color: #666666;
            display: block;
            padding: 5px 0;
        }

        .category-list li {
            display: block;
        }

            .category-list li i {
                margin-right: 8px;
                color: #3d4d5d;
            }

            .category-list li a .text-navy {
                color: #1ab394;
            }

            .category-list li a .text-primary {
                color: #1c84c6;
            }

            .category-list li a .text-info {
                color: #23c6c8;
            }

            .category-list li a .text-danger {
                color: #EF5352;
            }

            .category-list li a .text-warning {
                color: #F8AC59;
            }

        .file-manager h5.tag-title {
            margin-top: 20px;
        }

        .tag-list li {
            float: left;
        }

            .tag-list li a {
                font-size: 10px;
                background-color: #f3f3f4;
                padding: 5px 12px;
                color: inherit;
                border-radius: 2px;
                border: 1px solid #e7eaec;
                margin-right: 5px;
                margin-top: 5px;
                display: block;
            }

        .file {
            border: 1px solid #e7eaec;
            padding: 0;
            background-color: #ffffff;
            position: relative;
            margin-bottom: 20px;
            margin-right: 20px;
        }

        .file-manager .hr-line-dashed {
            margin: 15px 0;
        }

        .file .icon,
        .file .image {
            height: 100px;
            overflow: hidden;
        }

        .file .icon {
            padding: 15px 10px;
            text-align: center;
        }

        .file-control {
            color: inherit;
            font-size: 11px;
            margin-right: 10px;
        }

            .file-control.active {
                text-decoration: underline;
            }

        .file .icon i {
            font-size: 70px;
            color: #dadada;
        }

        .file .file-name {
            padding: 10px;
            background-color: #f8f8f8;
            border-top: 1px solid #e7eaec;
        }

        .file-name small {
            color: #676a6c;
        }

        ul.tag-list li {
            list-style: none;
        }

        .corner {
            position: absolute;
            display: inline-block;
            width: 0;
            height: 0;
            line-height: 0;
            border: 0.6em solid transparent;
            border-right: 0.6em solid #f1f1f1;
            border-bottom: 0.6em solid #f1f1f1;
            right: 0em;
            bottom: 0em;
        }

        a.compose-mail {
            padding: 8px 10px;
        }

        .mail-search {
            max-width: 300px;
        }

        .ibox {
            clear: both;
            margin-bottom: 25px;
            margin-top: 0;
            padding: 0;
        }

            .ibox.collapsed .ibox-content {
                display: none;
            }

            .ibox.collapsed .fa.fa-chevron-up:before {
                content: "\f078";
            }

            .ibox.collapsed .fa.fa-chevron-down:before {
                content: "\f077";
            }

            .ibox:after,
            .ibox:before {
                display: table;
            }

        .ibox-title {
            -moz-border-bottom-colors: none;
            -moz-border-left-colors: none;
            -moz-border-right-colors: none;
            -moz-border-top-colors: none;
            background-color: #ffffff;
            border-color: #e7eaec;
            border-image: none;
            border-style: solid solid none;
            border-width: 3px 0 0;
            color: inherit;
            margin-bottom: 0;
            padding: 14px 15px 7px;
            min-height: 48px;
        }

        .ibox-content {
            background-color: #ffffff;
            color: inherit;
            padding: 15px 20px 20px 20px;
            border-color: #e7eaec;
            border-image: none;
            border-style: solid solid none;
            border-width: 1px 0;
        }

        .ibox-footer {
            color: inherit;
            border-top: 1px solid #e7eaec;
            font-size: 90%;
            background: #ffffff;
            padding: 10px 15px;
        }

        a:hover {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <div class="container">
        <div class="row">
            <div class="col-md-3">
                <div class="ibox float-e-margins">
                    <div class="ibox-content">
                        <div class="file-manager">
                            <h5>Show:</h5>
                            <a href="#" class="file-control active">All</a>
                            <a href="#" class="file-control">Documents</a>
                            <a href="#" class="file-control">Audio</a>
                            <a href="#" class="file-control">Images</a>
                            <div class="hr-line-dashed"></div>
                            <button class="btn btn-primary btn-block">Upload Files</button>
                            <div class="hr-line-dashed"></div>
                            <h5>Folders</h5>
                            <ul class="folder-list" style="padding: 0" id="folder-list">
                                <!--<li>
                                    <a href=""><i class="fa fa-folder"></i> Files</a>
                                    <ul>
                                        <li><a href=""><i class="fa fa-folder"></i> Files</a></li>
                                        <li><a href=""><i class="fa fa-folder"></i> Pictures</a></li>
                                    </ul>
                                </li>
                                <li><a href=""><i class="fa fa-folder"></i> Pictures</a></li>-->
                            </ul>
                            <h5 class="tag-title">Tags</h5>
                            <ul class="tag-list" style="padding: 0">
                                <li><a href="">Family</a></li>
                                <li><a href="">Work</a></li>
                                <li><a href="">Home</a></li>
                                <li><a href="">Children</a></li>
                                <li><a href="">Holidays</a></li>
                                <li><a href="">Music</a></li>
                                <li><a href="">Photography</a></li>
                                <li><a href="">Film</a></li>
                            </ul>
                            <div class="clearfix"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-9 animated fadeInRight">
                <div class="row">
                    <div class="col-lg-12" id="file-list">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js" integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.24.0/moment-with-locales.min.js" crossorigin="anonymous"></script>
    <script type="text/javascript">
        $(document).ready(function () {

            $.ajax({
                url: 'http://localhost:8082/aliados/api/v1/Support/content',
                type: 'GET',
                contentType: 'application/json; charset=utf-8',
                dataType: 'json',
            }).done(function (data) {
                console.log(data);
                var folderList = $('#folder-list');
                var fileList = $('#file-list');
                var icon = 'file';
                var path = data.path;
                var filename = '';
                $.each(data.content, function (index, item) {
                    if (item.Folder == true)
                        folderList.append('<li id="' + item.Name + '"><a href="#" class="folder"><i class="fa fa-folder"></i> ' + item.Name + '</a></li>');
                    else {
                        if (item.Name.toLowerCase().endsWith('.ico'))
                            icon = 'file-image-o';
                        else if (item.Name.toLowerCase().endsWith('.config'))
                            icon = 'cog';
                        else
                            icon = 'file';
                        filename = btoa(path + '\\' + item.Name);
                        fileList.append('<div class="file-box"><div class="file">' +
                            '<a href="http://localhost:8082/aliados/api/v1/Support/Download?id=' + filename + '"><span class="corner"></span>' +
                            '<div class="icon"><i class="fa fa-' + icon + '"></i></div>' +
                            '<div class="file-name">' + item.Name + '<br>' +
                            '<small title="' + moment(item.LastWrite).format('DD/MM/YYYY hh:mma') + '" >Added: ' + moment(item.LastWrite).from() + '</small>' +
                            '</div></a></div></div>');
                    }
                });
            });

            $('#folder-list').on('click', "a.folder", function (event) {
                event.preventDefault();
                var parentId = event.target.parentElement.id;
                var parent = $('#' + parentId);
                var folderList = $('#' + parentId + ' ul');
                if ($('#' + parentId + ' ul').length == 0) {
                    parent.append('<ul></ul>');
                    folderList = $('#' + parentId + ' ul');
                }
                else
                    folderList = null;
                $.ajax({
                    url: 'http://localhost:8082/aliados/api/v1/Support/content?path=' + parentId.replace("-", "/"),
                    type: 'GET',
                    contentType: 'application/json; charset=utf-8',
                    dataType: 'json',
                }).done(function (data) {
                    var fileList = $('#file-list');
                    fileList.empty();
                    var icon = 'file';
                    var path = data.path;
                    var filename = '';
                    $.each(data.content, function (index, item) {
                        if (item.Folder == true) {
                            if (folderList != null)
                                folderList.append('<li id="' + parentId + '-' + item.Name + '"><a href="#" class="folder"><i class="fa fa-folder"></i> ' + item.Name + '</a></li>');
                        }
                        else {
                            if (item.Name.toLowerCase().endsWith('.ico'))
                                icon = 'file-image-o';
                            else if (item.Name.toLowerCase().endsWith('.config'))
                                icon = 'cog';
                            else
                                icon = 'file';
                            filename = btoa(path + '\\' + item.Name);
                            fileList.append('<div class="file-box"><div class="file">' +
                                '<a href="http://localhost:8082/aliados/api/v1/Support/Download?id=' + filename + '"><span class="corner"></span>' +
                                '<div class="icon"><i class="fa fa-' + icon + '"></i></div>' +
                                '<div class="file-name">' + item.Name + '<br>' +
                                '<small title="' + moment(item.LastWrite).format('DD/MM/YYYY hh:mma') + '" >Added: ' + moment(item.LastWrite).from() + '</small>' +
                                '</div></a></div></div>');
                        }
                    });
                });
            });
        });

    </script>
</body>
</html>
